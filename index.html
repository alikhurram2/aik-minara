<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aik Minara Masjid - Jama'at Timings</title>
  <meta name="description" content="Congregational prayer (Jama'at) timings for Aik Minara Masjid.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="pattern-overlay"></div>

  <div class="app-container">
    <!-- Tabs -->
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" role="tab" id="tab-timings" data-tab="timings" aria-selected="true">Prayer Timings</button>
      <button class="tab-btn" role="tab" id="tab-khutbah" data-tab="khutbah" aria-selected="false">Khutbah Audio</button>
    </nav>

    <!-- Header -->
    <header class="masjid-header">
      <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <h1 class="masjid-title">Aik Minara Masjid</h1>
      <p class="masjid-tagline">Jamaat Timings Today</p>

      <!-- Live Clock & Dates -->
      <div class="datetime-bar">
        <div class="time-item">
          <span class="live-clock" id="liveClock">--:--:--</span>
        </div>
        <div class="date-divider"></div>
        <div class="time-item">
          <span class="date-text" id="gregorianDate">--</span>
        </div>
        <div class="date-divider"></div>
        <div class="time-item">
          <span class="date-text hijri-date" id="hijriDate">--</span>
        </div>
      </div>
    </header>

    <!-- Vertical Timings List -->
    <main class="prayers-list tab-panel" id="panel-timings" role="tabpanel" aria-labelledby="tab-timings">
      <div class="prayers-list-inner" id="prayersList">
      <!-- 6 Prayer cards populated dynamically by app.js -->
      </div>
    </main>

    <!-- Jumu'ah Khutbah Recordings -->
    <section class="khutbah-section tab-panel" id="panel-khutbah" role="tabpanel" aria-labelledby="tab-khutbah" hidden>
      <h2 class="khutbah-heading" >
        Jumu'ah Khutbah Recordings
        <span class="khutbah-arabic">خطبة الجمعة</span>
      </h2>
      <div class="khutbah-list" id="khutbahList"></div>
    </section>

    <!-- Simple Footer -->
    <footer class="masjid-footer">
      <span>Aik Minara Masjid</span>
      <div class="sync-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="syncText">Updated</span>
      </div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="khutbah.js"></script>
  <script src="khutbah-ui.js"></script>
  <script src="tabs.js"></script>
</body>
</html>
